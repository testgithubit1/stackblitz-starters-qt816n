name: Notify Admins Before Deployment

on:
  push:
    branches:
      - main  # Trigger when code is pushed to the 'main' branch

jobs:
  notify-admins:
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Issue Notification
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
                  "title": "Deployment Notification",
                  "body": "🚨 A deployment is about to happen on the `main` branch. Please review the changes before deployment.",
                  "labels": ["deployment", "notification"]
                }' \
            "https://api.github.com/repos/${{ github.repository }}/issues"
